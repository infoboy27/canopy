name: Release Python Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version for the plugin release (e.g. 1.0.0). The 'plugin-python-v' prefix is added automatically."
        required: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Validate version and compute tag
        id: compute
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          PREFIX="plugin-python-v"
          # Back-compat: accept the full tag form (e.g. plugin-python-v1.0.4) too, not just
          # the bare version. DO NOT REMOVE: old forks pass the full tag when releasing.
          VERSION="${VERSION#"$PREFIX"}"
          # Tolerate a bare "v" prefix (e.g. v1.0.4) so the tag isn't doubled below.
          VERSION="${VERSION#v}"
          # Validate via the shared script (same semver check as the auto-updater).
          go run ./cmd/scripts/semver "$VERSION"
          echo "tag=${PREFIX}${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version '$VERSION' is valid. Release tag: ${PREFIX}${VERSION}"

      - name: Require a version higher than every existing plugin-python release
        env:
          NEW_TAG: ${{ steps.compute.outputs.tag }}
        run: |
          # The validator's auto-updater only applies a release whose semver is GREATER
          # than the one installed, and it discards anything else silently. This repo has
          # both v0.x.y and v2026.DDD.N tags, and semver compares major first, so a
          # "v0.6.0" can never beat "v2026.277.1": it would publish fine and never deploy.
          # See plugin/python/RELEASING.md.
          git ls-remote --tags origin 'refs/tags/plugin-python-v*' | sed 's|.*refs/tags/||; s|\^{}$||' | sort -u > existing.txt
          if grep -qx "$NEW_TAG" existing.txt; then
            echo "::error::Tag $NEW_TAG already exists."; exit 1
          fi
          HIGHEST=$(sort -V existing.txt | tail -n1)
          TOP=$(printf '%s\n%s\n' "$HIGHEST" "$NEW_TAG" | sort -V | tail -n1)
          if [ -n "$HIGHEST" ] && [ "$TOP" != "$NEW_TAG" ]; then
            echo "::error::$NEW_TAG does not exceed the highest existing release ($HIGHEST). The validator auto-updater would silently ignore it. Use the date-based scheme, e.g. 2026.<day-of-year>.<n> (see plugin/python/RELEASING.md)."
            exit 1
          fi
          echo "OK: $NEW_TAG > ${HIGHEST:-<none>}"

  release:
    name: Build and Release Python Plugin
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create distribution tarball
        working-directory: plugin/python
        run: |
          mkdir -p release
          # Create tarball with source code (venv is created on first run by pluginctl.sh)
          # Note: pluginctl.sh is NOT included - it's copied separately by Dockerfile
          # and we don't want old releases to overwrite newer pluginctl.sh versions
          tar --exclude='*.pyc' \
            --exclude='__pycache__' \
            -czf release/python-plugin.tar.gz \
            main.py \
            contract/ \
            pyproject.toml \
            Makefile

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "Python Plugin ${{ needs.validate.outputs.tag }}"
          body: |
            Python Plugin Release ${{ needs.validate.outputs.tag }}
            
            ## Requirements
            - Python 3.9 or later
            
            ## Installation
            1. Extract `python-plugin.tar.gz` to `plugin/python/`
            2. The plugin will create a virtual environment on first run
            
            ## Assets
            - `python-plugin.tar.gz` - Source code with pyproject.toml
          files: |
            plugin/python/release/python-plugin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
