syntax = "proto3";
package types;
option go_package = "github.com/canopy-network/go-plugin/contract";

import "google/protobuf/any.proto";
// Transaction represents a request or action submitted to the network like transfer assets or perform other operations
// within the blockchain system - THIS MUST MATCH lib.Transaction EXACTLY for signing
message Transaction {
  // message_type: The type of the transaction like 'send' or 'stake'
  string message_type = 1; // @gotags: json:"messageType"
  // msg: The actual transaction message payload, which is encapsulated in a generic message format
  google.protobuf.Any msg = 2;
  // signature: The cryptographic signature used to verify the authenticity of the transaction
  Signature signature = 3;
  // created_height: The height when the transaction was created - allows 'safe pruning'
  uint64 created_height = 4; // @gotags: json:"createdHeight"
  // time: The timestamp when the transaction was created - used as temporal entropy to prevent hash collisions in txs
  uint64 time = 5;
  // fee: The fee associated with processing the transaction
  uint64 fee = 6;
  // memo: An optional message or note attached to the transaction
  string memo = 7;
  // network_id: The identity of the network the transaction is intended for
  uint64 network_id = 8; // @gotags: json:"networkID"
  // chain_id: The identity of the committee the transaction is intended for
  uint64 chain_id = 9; // @gotags: json:"chainID"
  // nonce: The sender's protocol replay-protection nonce
  uint64 nonce = 10;
  // NOTE: CAN EXTEND FUNCTIONALITY BY ADDING ADDITIONAL FIELDS
  // NO CONFLICT STARTING AT FIELD = 25
}

// MessageSend is a standard transfer transaction, taking tokens from the sender and transferring
// them to the recipient
message MessageSend {
  // from_address: is the sender of the funds
  bytes from_address = 1; // @gotags: json:"fromAddress"
  // to_address: is the recipient of the funds
  bytes to_address = 2; // @gotags: json:"toAddress"
  // amount: is the amount of tokens in micro-denomination (uCNPY)
  uint64 amount = 3;
}

// FeeParams is the parameter space that defines various amounts for transaction fees
message FeeParams {
  // send_fee: is the fee amount (in uCNPY) for Message Send
  uint64 send_fee = 1; // @gotags: json:"sendFee"
  // NO CONFLICT STARTING AT FIELD = 14
}

// A Signature is a digital signature is a cryptographic "fingerprint" created with a private key,
// allowing others to verify the authenticity and integrity of a message using the corresponding public key
message Signature {
  // public_key: is a cryptographic code shared openly, used to verify digital signatures
  bytes public_key = 1; // @gotags: json:"publicKey"
  // signature: the bytes of the signature output from a private key which may be verified with the message and public
  bytes signature = 2;
}

// Example: MessageReward mints tokens to a recipient
message MessageReward {
  // admin_address: the admin authorizing the reward
  bytes admin_address = 1; // @gotags: json:"adminAddress"
  // recipient_address: who receives the reward
  bytes recipient_address = 2; // @gotags: json:"recipientAddress"
  // amount: tokens to mint
  uint64 amount = 3;
}

// MessageFaucet is a test-only transaction that mints tokens to any address
// No balance check required - just mints tokens for testing purposes
message MessageFaucet {
  // signer_address: the address signing this transaction (for auth)
  bytes signer_address = 1; // @gotags: json:"signerAddress"
  // recipient_address: who receives the tokens
  bytes recipient_address = 2; // @gotags: json:"recipientAddress"
  // amount: tokens to mint
  uint64 amount = 3;
}

// Faucet is a state record tracking the cumulative faucet mints to a recipient (test-only)
message Faucet {
  // recipient_address: the address that received faucet mints
  bytes recipient_address = 1; // @gotags: json:"recipientAddress"
  // total_amount: the cumulative amount minted to the recipient via faucet
  uint64 total_amount = 2; // @gotags: json:"totalAmount"
  // count: the number of faucet transactions received
  uint64 count = 3;
}

// Reward is a state record tracking the cumulative reward mints to a recipient
message Reward {
  // recipient_address: the address that received rewards
  bytes recipient_address = 1; // @gotags: json:"recipientAddress"
  // last_admin_address: the admin that authorized the most recent reward
  bytes last_admin_address = 2; // @gotags: json:"lastAdminAddress"
  // total_amount: the cumulative amount minted to the recipient via reward
  uint64 total_amount = 3; // @gotags: json:"totalAmount"
  // count: the number of reward transactions received
  uint64 count = 4;
}

// -- Bingo Rush: room escrow + provably-fair commit/reveal -------------------

// MessageOpenRoom opens a round and commits to a hidden seed (commit-reveal).
message MessageOpenRoom {
  bytes operator_address = 1; // @gotags: json:"operatorAddress"
  bytes round_id = 2;         // @gotags: json:"roundID"
  bytes commitment = 3;       // sha256(seed), revealed at settle
  uint64 entry_fee = 4;       // @gotags: json:"entryFee" base entry (uCNPY) for 1 card
  uint64 rake_bps = 5;        // @gotags: json:"rakeBps"
  repeated uint64 payout_weights_bps = 6; // @gotags: json:"payoutWeightsBps"
  uint64 operator_bond = 7;   // @gotags: json:"operatorBond" -- fair-randomness-v2: operator escrows this at open; returned on settle, slashed to treasury on expire
}

// MessageCloseRoom stops entries for a round and fixes the consensus-entropy
// window (fair-randomness-v2 A.4). Bets close BEFORE any block in the window
// exists, so the operator can neither predict nor grind the outcome.
message MessageCloseRoom {
  bytes operator_address = 1; // @gotags: json:"operatorAddress"
  bytes round_id = 2;         // @gotags: json:"roundID"
}

// MessageJoinRoom escrows a player entry into an open round.
message MessageJoinRoom {
  bytes player_address = 1; // @gotags: json:"playerAddress"
  bytes round_id = 2;       // @gotags: json:"roundID"
  uint64 num_cards = 3;     // @gotags: json:"numCards"
  uint64 amount = 4;        // coins escrowed (uCNPY)
}

// MessageSettleRoom reveals the seed and pays the verified winner from escrow.
message MessageSettleRoom {
  bytes operator_address = 1; // @gotags: json:"operatorAddress"
  bytes round_id = 2;         // @gotags: json:"roundID"
  bytes seed = 3;             // revealed; sha256(seed) must equal the commitment
  bytes winner_address = 4;   // @gotags: json:"winnerAddress"
  uint64 balls_drawn = 5;     // @gotags: json:"ballsDrawn"
  string pattern = 6;         // line|row|column|diagonal|four_corners|full_house
}

// MessageExpireRoom refunds every escrowed entry for a round whose operator
// never called MessageSettleRoom within the expiry window. Callable by ANYONE
// once the deadline has passed (caller pays the tx fee, receives nothing) --
// without this, an operator who never reveals the seed leaves every
// participant's entry fee stuck in escrow with no on-chain recourse.
message MessageExpireRoom {
  bytes caller_address = 1; // @gotags: json:"callerAddress"
  bytes round_id = 2;       // @gotags: json:"roundID"
}

// RoomRound is the on-chain state record for a round.
message RoomRound {
  bytes round_id = 1;         // @gotags: json:"roundID"
  bytes operator_address = 2; // @gotags: json:"operatorAddress"
  bytes commitment = 3;
  uint64 entry_fee = 4;       // @gotags: json:"entryFee"
  uint64 rake_bps = 5;        // @gotags: json:"rakeBps"
  uint64 escrow_total = 6;    // @gotags: json:"escrowTotal"
  uint64 num_players = 7;     // @gotags: json:"numPlayers"
  uint32 status = 8;          // 0 = open, 1 = settled, 2 = expired (refunded), 3 = closed (entropy window fixed, awaiting settle)
  repeated bytes participant_addresses = 9;   // @gotags: json:"participantAddresses"
  repeated uint64 participant_num_cards = 10;  // @gotags: json:"participantNumCards"
  repeated uint64 payout_weights_bps = 11;     // @gotags: json:"payoutWeightsBps"
  uint64 opened_height = 12;  // @gotags: json:"openedHeight" -- block height MessageOpenRoom landed at; the expiry deadline for MessageExpireRoom
  uint64 operator_bond = 13;  // @gotags: json:"operatorBond" -- amount the operator escrowed at open (fair-randomness-v2)
  uint64 close_height = 14;   // @gotags: json:"closeHeight" -- block MessageCloseRoom landed at; 0 while still open
  uint64 entropy_start = 15;  // @gotags: json:"entropyStart" -- first finalized block height folded into the settle entropy
  uint64 entropy_end = 16;    // @gotags: json:"entropyEnd" -- last finalized block height folded into the settle entropy
}

// RoomParticipant records one player entry in a round.
message RoomParticipant {
  bytes round_id = 1;       // @gotags: json:"roundID"
  bytes player_address = 2; // @gotags: json:"playerAddress"
  uint64 num_cards = 3;     // @gotags: json:"numCards"
  uint64 amount = 4;
}

// -- Bingo Rush: on-chain economy (coins/gems) + NFT cosmetics ---------------

// MessageBuyCoins mints native coins to a recipient (IAP fulfillment, admin-authorised).
message MessageBuyCoins {
  bytes admin_address = 1;     // @gotags: json:"adminAddress"
  bytes recipient_address = 2; // @gotags: json:"recipientAddress"
  uint64 amount = 3;
}

// MessageBuyGems mints gems (the hard currency) to a recipient.
message MessageBuyGems {
  bytes admin_address = 1;     // @gotags: json:"adminAddress"
  bytes recipient_address = 2; // @gotags: json:"recipientAddress"
  uint64 amount = 3;
}

// MessageTransferGems moves gems between players.
message MessageTransferGems {
  bytes from_address = 1; // @gotags: json:"fromAddress"
  bytes to_address = 2;   // @gotags: json:"toAddress"
  uint64 amount = 3;
}

// MessageMintCosmetic grants a cosmetic NFT to an owner (operator-authorised).
message MessageMintCosmetic {
  bytes operator_address = 1; // @gotags: json:"operatorAddress"
  bytes token_id = 2;         // @gotags: json:"tokenID"
  string kind = 3;            // shop item id, e.g. "galaxy"
  bytes owner_address = 4;    // @gotags: json:"ownerAddress"
}

// MessageBuyCosmetic lets a player buy a cosmetic NFT with gems (price from the catalog).
message MessageBuyCosmetic {
  bytes player_address = 1; // @gotags: json:"playerAddress"
  bytes token_id = 2;       // @gotags: json:"tokenID"
  string kind = 3;          // must be a gem-priced shop item
}

// MessageTransferCosmetic transfers ownership of a cosmetic NFT.
message MessageTransferCosmetic {
  bytes from_address = 1; // @gotags: json:"fromAddress"
  bytes to_address = 2;   // @gotags: json:"toAddress"
  bytes token_id = 3;     // @gotags: json:"tokenID"
}

// GemBalance is the per-address gem balance record.
message GemBalance {
  bytes address = 1;
  uint64 amount = 2;
}

// Cosmetic is an owned NFT record (ERC-721-like).
message Cosmetic {
  bytes token_id = 1;      // @gotags: json:"tokenID"
  string kind = 2;
  bytes owner_address = 3; // @gotags: json:"ownerAddress"
}

// -- Roulette: single-round commit/reveal betting, same escrow shape as Bingo rooms --

// MessageOpenRoulette opens a round and commits to a hidden seed (commit-reveal).
message MessageOpenRoulette {
  bytes operator_address = 1; // @gotags: json:"operatorAddress"
  bytes round_id = 2;         // @gotags: json:"roundID"
  bytes commitment = 3;       // sha256(seed), revealed at settle
  uint64 rake_bps = 4;        // @gotags: json:"rakeBps"
  uint64 operator_bond = 5;   // @gotags: json:"operatorBond" -- fair-randomness-v2: escrowed at open, returned on settle, slashed on expire
}

// MessageCloseRoulette stops bets and fixes the consensus-entropy window
// (fair-randomness-v2 A.4).
message MessageCloseRoulette {
  bytes operator_address = 1; // @gotags: json:"operatorAddress"
  bytes round_id = 2;         // @gotags: json:"roundID"
}

// MessageRouletteBet escrows one bet into an open round. One bet per address
// per round in v1 -- a second bet from the same address is rejected, not
// merged, so payout accounting stays a simple per-address lookup.
message MessageRouletteBet {
  bytes player_address = 1; // @gotags: json:"playerAddress"
  bytes round_id = 2;       // @gotags: json:"roundID"
  string bet_type = 3;      // @gotags: json:"betType" -- straight|red|black|odd|even|low|high|dozen1..3|col1..3
  uint64 bet_number = 4;    // @gotags: json:"betNumber" -- only meaningful for "straight" (0-36)
  uint64 amount = 5;        // coins escrowed (uCNPY)
}

// MessageSettleRoulette reveals the seed; the plugin derives the spin and pays every winner.
message MessageSettleRoulette {
  bytes operator_address = 1; // @gotags: json:"operatorAddress"
  bytes round_id = 2;         // @gotags: json:"roundID"
  bytes seed = 3;             // revealed; sha256(seed) must equal the commitment
}

// MessageExpireRoulette refunds every bet for a round the operator never
// settled, once ROOM_EXPIRY_BLOCKS have passed. Callable by anyone.
message MessageExpireRoulette {
  bytes caller_address = 1; // @gotags: json:"callerAddress"
  bytes round_id = 2;       // @gotags: json:"roundID"
}

// RouletteRound is the on-chain state record for a round.
message RouletteRound {
  bytes round_id = 1;         // @gotags: json:"roundID"
  bytes operator_address = 2; // @gotags: json:"operatorAddress"
  bytes commitment = 3;
  uint64 rake_bps = 4;        // @gotags: json:"rakeBps"
  uint64 pot_total = 5;       // @gotags: json:"potTotal"
  uint32 status = 6;          // 0 = open, 1 = settled, 2 = expired (refunded), 3 = closed (entropy window fixed, awaiting settle)
  repeated bytes bettor_addresses = 7; // @gotags: json:"bettorAddresses"
  uint64 opened_height = 8;   // @gotags: json:"openedHeight"
  bytes seed = 9;             // revealed seed, empty until settled
  uint32 spin = 10;           // winning number 0-36, only meaningful once settled
  uint64 operator_bond = 11;  // @gotags: json:"operatorBond"
  uint64 close_height = 12;   // @gotags: json:"closeHeight"
  uint64 entropy_start = 13;  // @gotags: json:"entropyStart"
  uint64 entropy_end = 14;    // @gotags: json:"entropyEnd"
}

// RouletteBetRecord records one player's escrowed bet in a round.
message RouletteBetRecord {
  bytes round_id = 1;       // @gotags: json:"roundID"
  bytes player_address = 2; // @gotags: json:"playerAddress"
  string bet_type = 3;      // @gotags: json:"betType"
  uint64 bet_number = 4;    // @gotags: json:"betNumber"
  uint64 amount = 5;
}

// -- Domino: heads-up (2-player) block variant with boneyard draw --
//
// Unlike Bingo/Roulette, the outcome depends on which legal move each player
// CHOSE, not just the seed -- there's no pure function seed -> winner. So
// settle carries the full move log alongside the revealed seed; the plugin
// independently replays the deal AND every move (validated legal at the time
// it was made) to derive the winner itself. The operator's claim is checked,
// never trusted.

// MessageOpenDomino opens a round and commits to a hidden seed (commit-reveal).
message MessageOpenDomino {
  bytes operator_address = 1; // @gotags: json:operatorAddress
  bytes round_id = 2;         // @gotags: json:roundID
  bytes commitment = 3;       // sha256(seed), revealed at settle
  uint64 entry_fee = 4;       // @gotags: json:entryFee -- each of the 2 players escrows exactly this amount
  uint64 rake_bps = 5;        // @gotags: json:rakeBps
  uint64 operator_bond = 6;   // @gotags: json:operatorBond -- fair-randomness-v2: escrowed at open, returned on settle, slashed on expire
}

// MessageCloseDomino stops joins and fixes the consensus-entropy window
// (fair-randomness-v2 A.4).
message MessageCloseDomino {
  bytes operator_address = 1; // @gotags: json:operatorAddress
  bytes round_id = 2;         // @gotags: json:roundID
}

// MessageJoinDomino escrows one player's entry fee into an open round.
// Exactly 2 players per round; a 3rd join is rejected.
message MessageJoinDomino {
  bytes player_address = 1; // @gotags: json:playerAddress
  bytes round_id = 2;       // @gotags: json:roundID
  uint64 amount = 3;
}

// DominoMoveRecord is one turn in the claimed move log submitted at settle.
message DominoMoveRecord {
  string action = 1;    // play | draw | pass
  uint32 tile_low = 2;  // meaningful only for play
  uint32 tile_high = 3; // meaningful only for play
  string end = 4;       // left | right -- meaningful only for play once the board is non-empty
}

// MessageSettleDomino reveals the seed and the full move log; the plugin
// replays both to derive the winner independently.
message MessageSettleDomino {
  bytes operator_address = 1;               // @gotags: json:operatorAddress
  bytes round_id = 2;                       // @gotags: json:roundID
  bytes seed = 3;                           // revealed; sha256(seed) must equal the commitment
  repeated DominoMoveRecord moves = 4;
}

// MessageExpireDomino refunds both entry fees for a round the operator never
// settled, once ROOM_EXPIRY_BLOCKS have passed. Callable by anyone.
message MessageExpireDomino {
  bytes caller_address = 1; // @gotags: json:callerAddress
  bytes round_id = 2;       // @gotags: json:roundID
}

// DominoRound is the on-chain state record for a round.
message DominoRound {
  bytes round_id = 1;                        // @gotags: json:roundID
  bytes operator_address = 2;                // @gotags: json:operatorAddress
  bytes commitment = 3;
  uint64 entry_fee = 4;                      // @gotags: json:entryFee
  uint64 rake_bps = 5;                       // @gotags: json:rakeBps
  uint64 escrow_total = 6;                   // @gotags: json:escrowTotal
  uint32 status = 7;                         // 0 = open, 1 = settled, 2 = expired (refunded), 3 = closed (entropy window fixed, awaiting settle)
  repeated bytes participant_addresses = 8;  // @gotags: json:participantAddresses -- join order = player slot
  uint64 opened_height = 9;                  // @gotags: json:openedHeight
  bytes seed = 10;                           // revealed seed, empty until settled
  repeated uint32 winner_slots = 11;          // @gotags: json:winnerSlots -- >1 entry only on a tied block
  string result_reason = 12;                 // @gotags: json:resultReason -- emptied_hand | blocked
  uint64 operator_bond = 13;                 // @gotags: json:operatorBond
  uint64 close_height = 14;                  // @gotags: json:closeHeight
  uint64 entropy_start = 15;                 // @gotags: json:entropyStart
  uint64 entropy_end = 16;                   // @gotags: json:entropyEnd
}

// -- Poker: heads-up (2-player) No-Limit Texas Hold'em, fixed blinds --
//
// Same replay-at-settle trustlessness as Domino, extended further: not just
// action legality but a full best-of-7 hand evaluation at showdown, and
// money amounts (bets/raises) instead of simple tile placement. No side
// pots -- deferred, only matters with 3+ players at different stack sizes.

// MessageOpenPoker opens a round and commits to a hidden seed (commit-reveal).
message MessageOpenPoker {
  bytes operator_address = 1; // @gotags: json:operatorAddress
  bytes round_id = 2;         // @gotags: json:roundID
  bytes commitment = 3;       // sha256(seed), revealed at settle
  uint64 small_blind = 4;     // @gotags: json:smallBlind
  uint64 big_blind = 5;       // @gotags: json:bigBlind
  uint64 buy_in = 6;          // @gotags: json:buyIn -- each of the 2 players escrows exactly this amount
  uint64 rake_bps = 7;        // @gotags: json:rakeBps
  uint64 operator_bond = 8;   // @gotags: json:operatorBond -- fair-randomness-v2: escrowed at open, returned on settle, slashed on expire
}

// MessageClosePoker stops joins and fixes the consensus-entropy window
// (fair-randomness-v2 A.4).
message MessageClosePoker {
  bytes operator_address = 1; // @gotags: json:operatorAddress
  bytes round_id = 2;         // @gotags: json:roundID
}

// MessageJoinPoker escrows one player's buy-in into an open round.
// Exactly 2 players per round; a 3rd join is rejected.
message MessageJoinPoker {
  bytes player_address = 1; // @gotags: json:playerAddress
  bytes round_id = 2;       // @gotags: json:roundID
  uint64 amount = 3;
}

// PokerActionRecord is one action in the claimed betting log submitted at
// settle. No player field -- whose turn it is is fully determined by the
// engine itself from the actions that came before, same as Domino's moves.
message PokerActionRecord {
  string action = 1; // fold | check_call | bet_raise
  uint64 amount = 2; // meaningful only for bet_raise -- TOTAL contributed to the current street after this action
}

// MessageSettlePoker reveals the seed and the full action log; the plugin
// replays both to derive the winner and pot independently.
message MessageSettlePoker {
  bytes operator_address = 1;             // @gotags: json:operatorAddress
  bytes round_id = 2;                     // @gotags: json:roundID
  bytes seed = 3;                         // revealed; sha256(seed) must equal the commitment
  repeated PokerActionRecord actions = 4;
}

// MessageExpirePoker refunds both buy-ins for a round the operator never
// settled, once ROOM_EXPIRY_BLOCKS have passed. Callable by anyone.
message MessageExpirePoker {
  bytes caller_address = 1; // @gotags: json:callerAddress
  bytes round_id = 2;       // @gotags: json:roundID
}

// PokerRound is the on-chain state record for a round.
message PokerRound {
  bytes round_id = 1;                        // @gotags: json:roundID
  bytes operator_address = 2;                // @gotags: json:operatorAddress
  bytes commitment = 3;
  uint64 small_blind = 4;                    // @gotags: json:smallBlind
  uint64 big_blind = 5;                      // @gotags: json:bigBlind
  uint64 buy_in = 6;                         // @gotags: json:buyIn
  uint64 rake_bps = 7;                       // @gotags: json:rakeBps
  uint64 escrow_total = 8;                   // @gotags: json:escrowTotal
  uint32 status = 9;                         // 0 = open, 1 = settled, 2 = expired (refunded), 3 = closed (entropy window fixed, awaiting settle)
  repeated bytes participant_addresses = 10; // @gotags: json:participantAddresses -- join order: 0=dealer/SB, 1=BB
  uint64 opened_height = 11;                 // @gotags: json:openedHeight
  bytes seed = 12;                           // revealed seed, empty until settled
  repeated uint32 winner_slots = 13;          // @gotags: json:winnerSlots
  string result_reason = 14;                 // @gotags: json:resultReason -- fold | showdown
  uint64 operator_bond = 15;                 // @gotags: json:operatorBond
  uint64 close_height = 16;                  // @gotags: json:closeHeight
  uint64 entropy_start = 17;                 // @gotags: json:entropyStart
  uint64 entropy_end = 18;                   // @gotags: json:entropyEnd
}
